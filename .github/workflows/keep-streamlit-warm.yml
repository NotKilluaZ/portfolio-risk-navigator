name: Keep Streamlit App Warm

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping Streamlit app
        run: |
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --max-time 90 \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            "https://portfolio-risk-navigator.streamlit.app/_stcore/health"
